<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" fill="none">
  <rect width="600" height="900" fill="#0D1E35"/>

  <!-- Background pattern: subtle grid lines -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a2d47" stroke-width="0.5"/>
  </pattern>
  <rect width="600" height="900" fill="url(#grid)"/>

  <!-- Orange accent bar left -->
  <rect x="0" y="0" width="4" height="900" fill="#F07040"/>

  <!-- Person silhouette -->
  <!-- Head -->
  <circle cx="300" cy="280" r="90" fill="#1a3050"/>
  <!-- Shoulders / Body -->
  <path d="M 100 680 Q 100 480 200 440 Q 240 420 300 415 Q 360 420 400 440 Q 500 480 500 680 Z" fill="#1a3050"/>

  <!-- Helmet on head -->
  <path d="M 215 250 Q 220 185 300 175 Q 380 185 385 250 L 390 265 Q 300 245 210 265 Z" fill="#F07040" opacity="0.9"/>
  <rect x="205" y="260" width="190" height="14" rx="7" fill="#F07040" opacity="0.7"/>

  <!-- Work vest outline -->
  <path d="M 185 455 L 175 520 L 200 530 L 210 490 L 300 510 L 390 490 L 400 530 L 425 520 L 415 455 Q 370 430 300 428 Q 230 430 185 455 Z" fill="#243850"/>
  <!-- Vest stripe -->
  <path d="M 175 510 L 200 518 L 200 530 L 175 522 Z" fill="#F07040" opacity="0.6"/>
  <path d="M 425 510 L 400 518 L 400 530 L 425 522 Z" fill="#F07040" opacity="0.6"/>

  <!-- KM Trockenbau initials -->
  <text x="300" y="360" text-anchor="middle" fill="#F07040" font-family="serif" font-size="36" font-weight="bold" opacity="0.8">K.M.</text>

  <!-- Bottom label area -->
  <rect x="0" y="800" width="600" height="100" fill="#0A1628" opacity="0.85"/>
  <text x="300" y="843" text-anchor="middle" fill="#F07040" font-family="sans-serif" font-size="11" font-weight="600" letter-spacing="3">INHABER</text>
  <text x="300" y="865" text-anchor="middle" fill="white" font-family="sans-serif" font-size="16" font-weight="700" letter-spacing="1">Kalac Mujo</text>
  <text x="300" y="884" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="sans-serif" font-size="10" letter-spacing="2">K.M. TROCKENBAU · REGENSBURG</text>
</svg>
